<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Casa Caril Tia Lercia</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet"><style>body{font-family:'Inter',sans-serif}h1,h2{font-family:'Playfair Display',serif}</style></head><body class="bg-stone-50 text-stone-900"><nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-stone-200 px-6 py-4 flex items-center justify-between"><h1 class="text-2xl font-bold text-orange-700">Tia Lercia</h1><div class="flex items-center gap-4"><button onclick="openModal()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Novo Prato</button><button class="relative"><i data-lucide="shopping-bag"></i><span id="cart-count" class="absolute -top-2 -right-2 bg-stone-900 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span></button></div></nav><main class="p-6 max-w-6xl mx-auto"><div class="mb-8"><input type="text" id="search" placeholder="Buscar pratos..." class="w-full p-4 border border-stone-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none"></div><div id="menu-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div></main><div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4"><div class="bg-white p-8 rounded-2xl w-full max-w-md"><h2 class="text-xl mb-4">Adicionar Prato</h2><input type="text" id="name" placeholder="Nome do prato" class="w-full mb-3 p-2 border rounded"><input type="text" id="price" placeholder="Preço" class="w-full mb-3 p-2 border rounded"><input type="text" id="image" placeholder="URL da Imagem" class="w-full mb-4 p-2 border rounded"><div class="flex gap-2"><button onclick="closeModal()" class="flex-1 py-2 border rounded">Cancelar</button><button onclick="addPrato()" class="flex-1 py-2 bg-orange-600 text-white rounded">Salvar</button></div></div></div><script>let cart = JSON.parse(localStorage.getItem('cart') || '[]');let menu = JSON.parse(localStorage.getItem('menu') || '[{"name":"Caril de Camarão","price":"45.00","image":"https://images.unsplash.com/photo-1596797038530-2c107229654b?w=500"},{"name":"Caril de Frango","price":"38.00","image":"https://images.unsplash.com/photo-1603894584373-5ac82b248989?w=500"}]');function render(){const grid=document.getElementById('menu-grid');grid.innerHTML=menu.map((p,i)=>`<div class="bg-white rounded-2xl p-4 shadow-sm"><img src="${p.image}" class="w-full h-48 object-cover rounded-xl mb-4"><h3 class="font-bold">${p.name}</h3><p class="text-orange-700 font-semibold">R$ ${p.price}</p><button onclick="addToCart(${i})" class="w-full mt-4 py-2 bg-stone-100 hover:bg-orange-100 transition rounded-lg">Adicionar</button></div>`).join('');lucide.createIcons();}function openModal(){document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function addPrato(){const name=document.getElementById('name').value;const price=document.getElementById('price').value;const image=document.getElementById('image').value;menu.push({name,price,image});localStorage.setItem('menu',JSON.stringify(menu));render();closeModal()}function addToCart(i){cart.push(menu[i]);localStorage.setItem('cart',JSON.stringify(cart));document.getElementById('cart-count').innerText=cart.length}render()</script></body></html>
